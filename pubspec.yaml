name: journey_sdk
description: "High-performance, offline-first session & user journey tracking SDK for Flutter apps with Hive persistence and BLoC."
version: 1.0.1
homepage: https://ufdevs.live
repository: https://github.com/ufdevs/journey_sdk
issue_tracker: https://github.com/ufdevs/journey_sdk/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: '>=8.0.0 <10.0.0'
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  device_info_plus: '>=10.0.0 <14.0.0'
  package_info_plus: '>=8.0.0 <11.0.0'
  uuid: '>=3.0.0 <5.0.0'
  http: '>=0.13.0 <2.0.0'
  connectivity_plus: '>=5.0.0 <8.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
